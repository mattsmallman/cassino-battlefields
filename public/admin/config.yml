# Sveltia CMS configuration for the Cassino Battlefields site.
# Every save is a Git commit; the site rebuilds from the commit. Field rules are
# enforced again at build time by src/content.config.ts, so a bad save fails the
# build instead of breaking the live site.

backend:
  name: github
  repo: mattsmallman/cassino-battlefields
  branch: main
  # For sign-in on the live site, deploy Sveltia's OAuth helper (a Cloudflare Worker,
  # github.com/sveltia/sveltia-cms-auth) and set its URL here:
  # base_url: https://cassino-cms-auth.<your-subdomain>.workers.dev
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Upload “{{path}}”'
    deleteMedia: 'Delete “{{path}}”'

site_url: https://www.cassinobattlefields.co.uk
display_url: https://www.cassinobattlefields.co.uk

# The photo library. Every photo on the site lives here once; the build makes
# fast web sizes from it.
media_folder: public/img/library
public_folder: /img/library

collections:
- name: tours
  label: Tours, dates & prices
  label_singular: Tour
  description: One entry per tour. Change dates and prices here; past departures drop off the site automatically. New tours appear on the site
    as soon as they are saved.
  folder: src/content/tours
  format: json
  extension: json
  create: true
  delete: false
  identifier_field: name
  summary: '{{name}}: {{next_start}}'
  sortable_fields:
  - order
  - name
  fields:
  - name: name
    label: Tour name
    widget: string
  - name: short
    label: One-line description
    widget: string
  - name: period
    label: Period of the war
    widget: string
    hint: 'For example: January – May 1944'
  - name: days
    label: Length (days)
    widget: number
    value_type: int
    min: 1
    max: 21
  - name: summary
    label: Summary paragraph
    widget: text
  - name: next_label
    label: Next departure – name shown
    widget: string
    required: false
    hint: Leave blank to use the tour name
  - name: next_start
    label: Next departure – first day
    widget: datetime
    time_format: false
    format: YYYY-MM-DD
    required: false
  - name: next_end
    label: Next departure – last day
    widget: datetime
    time_format: false
    format: YYYY-MM-DD
    required: false
  - name: next_note
    label: Text when there is no date
    widget: string
    required: false
    hint: 'For example: On request. Used only when no date is set.'
  - name: price_twin
    label: Price per person sharing (£)
    widget: number
    value_type: int
    required: false
  - name: price_single
    label: Price per person in a single room (£)
    widget: number
    value_type: int
    required: false
  - name: price_basis
    label: Board
    widget: select
    options:
    - B&B
    - half board
    - full board
    default: B&B
  - name: excludes
    label: Not included
    widget: string
  - name: arrive
    label: Fly into
    widget: string
  - name: depart
    label: Fly home from
    widget: string
  - name: base
    label: Where you stay
    widget: string
    required: false
  - name: group_size
    label: Group size
    widget: string
    required: false
    hint: 'For example: 8 to 50'
  - name: walking
    label: Walking
    widget: string
    required: false
  - name: deposit
    label: Deposit
    widget: string
    required: false
    hint: 'For example: £80 per person'
  - name: included
    label: What’s included
    widget: list
    required: false
    field:
      name: item
      label: Item
      widget: string
  - name: hero_image
    label: Main photo
    widget: image
    required: false
  - name: hero_caption
    label: Main photo caption
    widget: string
    required: false
  - name: itinerary
    label: Day-by-day itinerary
    label_singular: Day
    widget: list
    required: false
    summary: '{{fields.stands}}'
    fields:
    - name: stands
      label: Stands and visits
      label_singular: Stand
      widget: list
      field:
        name: stand
        label: Stand
        widget: text
  - name: photos
    label: Photos within the itinerary
    label_singular: Photo
    widget: list
    required: false
    summary: '{{fields.caption}}'
    fields:
    - name: image
      label: Photo
      widget: image
    - name: caption
      label: Caption
      widget: string
      required: false
  - name: map_area
    label: 'Overview map: area shown'
    widget: object
    required: false
    collapsed: true
    hint: The edges of the map in decimal degrees. In Google Maps, right-click a point to copy its coordinates.
    fields:
    - name: west
      label: West edge (longitude)
      widget: number
      value_type: float
    - name: south
      label: South edge (latitude)
      widget: number
      value_type: float
    - name: east
      label: East edge (longitude)
      widget: number
      value_type: float
    - name: north
      label: North edge (latitude)
      widget: number
      value_type: float
  - name: map_places
    label: 'Overview map: places'
    widget: list
    required: false
    label_singular: Place
    summary: '{{fields.name}} ({{fields.kind}})'
    fields:
    - name: name
      label: Name
      widget: string
    - name: lat
      label: Latitude
      widget: number
      value_type: float
    - name: lng
      label: Longitude
      widget: number
      value_type: float
    - name: kind
      label: Type
      widget: select
      options:
      - label: Airport
        value: airport
      - label: Where you stay
        value: base
      - label: Place studied
        value: place
      default: place
    - name: label
      label: Label position
      widget: select
      options:
      - label: Right
        value: right
      - label: Left
        value: left
      - label: Below right
        value: below-right
      - label: Below left
        value: below-left
      default: right
  - name: map_route
    label: 'Overview map: join all places with the route line'
    widget: boolean
    default: false
    required: false
    hint: 'Off: the line joins only airports and where you stay.'
  - name: gallery
    label: Gallery shown on this tour page
    widget: relation
    collection: galleries
    value_field: '{{slug}}'
    search_fields:
    - title
    display_fields:
    - title
    required: false
  - name: coords
    label: Map reference shown on the photo
    widget: string
    hint: 'For example: 41°29′N 13°48′E'
  - name: seo_description
    label: Search engine description
    widget: text
    required: false
    hint: Leave blank to generate one from the tour details.
  - name: order
    label: Position in tour lists
    widget: number
    value_type: int
  slug: '{{fields.name}}'
- name: testimonials

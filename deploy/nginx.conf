server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # Old WordPress URLs
    location = /home/ { return 301 /; }
    location = /home-2/ { return 301 /; }
    location = /cassino-gallery/ { return 301 /gallery/#cassino; }
    location = /anzio-gallery/ { return 301 /gallery/#anzio; }
    location = /salerno-gallery/ { return 301 /gallery/#salerno; }
    location = /gothic-line-gallery/ { return 301 /gallery/#gothic-line; }
    location = /rome-to-bologna-gallery/ { return 301 /rome-to-bologna/; }
    location = /general-reading-list/ { return 301 /reading-list/#general; }
    location = /regiment-core/ { return 301 /reading-list/#regiments; }
    location ^~ /wp-content/ { return 301 /gallery/; }
    location ~ ^/(wp-login\.php|wp-admin|xmlrpc\.php|wp-json) { return 410; }
    location = /feed/ { return 410; }

    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    # Site editor (Sveltia CMS). Talks to the GitHub API from the browser, so it gets
    # its own CSP. Put Cloudflare Access in front of /admin/ before going live.
    location /admin/ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.githubusercontent.com https://github.com; connect-src 'self' blob: data: https://api.github.com https://*.githubusercontent.com https://*.workers.dev; worker-src 'self' blob:; frame-ancestors 'none'" always;
        try_files $uri $uri/index.html =404;
    }

    # Map assets: ES-module worker and PMTiles archives (served with byte ranges)
    location /maps/ {
        types { application/javascript mjs; application/x-protobuf pbf; application/octet-stream pmtiles; }
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag";
        try_files $uri =404;
    }
    location /img/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
    error_page 404 /404.html;
}
